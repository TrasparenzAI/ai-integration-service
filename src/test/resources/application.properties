# ------------------------------------------------------------
# Config Server disabilitato nei test
# ------------------------------------------------------------
# Questo file ha lo stesso nome di src/main/resources/application.properties
# e lo sostituisce sul classpath di test: le proprieta' definite la' NON sono
# visibili qui e vanno ripetute se servono al caricamento del contesto.
# Senza questa riga spring-cloud-starter-config pretende uno spring.config.import
# e il contesto non parte (ConfigDataMissingEnvironmentPostProcessor$ImportException).
spring.cloud.config.enabled=false

# MCP ABILITATO per lo sviluppo in locale (attenzione agli errori di avvio se i server MCP non sono attivi)
spring.ai.mcp.client.enabled=false


# ------------------------------------------------------------
# Sicurezza: OAuth2 Resource Server (JWT)
# ------------------------------------------------------------
# Nei test si usa jwk-set-uri e non issuer-uri: con issuer-uri Spring Boot esegue il
# discovery OIDC alla creazione del bean JwtDecoder, quindi il caricamento del contesto
# fallirebbe se il Keycloak non fosse raggiungibile. Con jwk-set-uri la chiamata avviene
# solo alla validazione del primo token, che nei test non accade.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/realms/test/protocol/openid-connect/certs

# Authserver common config: endpoint espliciti per lo stesso motivo (issuer-uri farebbe
# discovery all'avvio anche per le client registration). Nessuno viene chiamato nei test.
spring.security.oauth2.client.provider.authserver.authorization-uri=http://localhost/realms/test/protocol/openid-connect/auth
spring.security.oauth2.client.provider.authserver.token-uri=http://localhost/realms/test/protocol/openid-connect/token
spring.security.oauth2.client.provider.authserver.jwk-set-uri=http://localhost/realms/test/protocol/openid-connect/certs

# Security: for getting tokens used when calling MCP tools
spring.security.oauth2.client.registration.authserver.client-id=test-client
spring.security.oauth2.client.registration.authserver.client-secret=test-secret
spring.security.oauth2.client.registration.authserver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.authserver.provider=authserver
# Con gli endpoint espliciti (senza issuer-uri) Spring Boot non applica il redirect-uri
# di default, che va quindi indicato: senza di esso la ClientRegistration non e' valida.
spring.security.oauth2.client.registration.authserver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Security: for getting tokens used when listing tools, initializing, etc.
spring.security.oauth2.client.registration.authserver-client-credentials.client-id=test-client
spring.security.oauth2.client.registration.authserver-client-credentials.client-secret=test-secret
spring.security.oauth2.client.registration.authserver-client-credentials.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.authserver-client-credentials.provider=authserver

ai.systemPrompt=SEI UN ASSISTENTE INGEGNERISTICO ESPERTO CHE PARLA SOLO ITALIANO.

# ------------------------------------------------------------
# Servizi esterni: solo URL/placeholder, nei test non vengono chiamati
# ------------------------------------------------------------
# Necessario per risolvere il placeholder di @FeignClient(url = "${whisper.base-url}")
whisper.base-url=http://localhost:9000
kokoro.base-url=http://localhost:8880

ai.text-to-speech.enable=false
ai.text-to-speech.voice=if_sara
ai.text-to-speech.model=kokoro
ai.text-to-speech.response_format=mp3
ai.text-to-speech.response_timeout=10m

sse.emitter.timeout=10m
